services:
    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
#            target: ${BUILD_TARGET:-development}
        container_name: my_blog_app
        restart: unless-stopped
        volumes:
            - ${VOLUME_MOUNT:-../}:/var/www/html
        environment:
            DATABASE_URL: "mysql://${DB_USER:-user}:${DB_PASSWORD}@db:3306/${DB_NAME:-blog_db}?serverVersion=8.0.32&charset=utf8mb4"
            MAILER_DSN: "smtp://mailhog:1025"
            APP_ENV: ${APP_ENV:-dev}
            APP_SECRET: ${APP_SECRET}
            MESSENGER_TRANSPORT_DSN: redis://redis:6379/messages
        depends_on:
            - db
            - redis
        networks:
            - symfony_network


    nginx:
        image: nginx:alpine
        container_name: my_blog_nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
            - ${VOLUME_MOUNT:-../}/public:/var/www/html/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks:
            - symfony_network


    db:
        image: mysql:8.0
        container_name: my_blog_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_NAME:-blog_db}
            MYSQL_USER: ${DB_USER:-user}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3307:3306"
        networks:
            - symfony_network
        command: --default-authentication-plugin=mysql_native_password

    mailhog:
        image: mailhog/mailhog
        container_name: my_blog_mailhog
        restart: unless-stopped
        ports:
            - "${MAILHOG_SMTP_PORT:-1025}:1025"
            - "${MAILHOG_WEB_PORT:-8025}:8025"
        networks:
            - symfony_network

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        container_name: my_blog_redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - symfony_network



networks:
    symfony_network:
        driver: bridge

volumes:
    db_data:
        driver: local
    redis_data:
        driver: local
