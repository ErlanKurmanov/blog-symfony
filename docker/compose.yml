services:
    app:
        build:
            context: ..
            dockerfile: docker/Dockerfile
            target: ${BUILD_TARGET:-development}
        container_name: my_blog_app
        restart: unless-stopped
        volumes:
            #//TODO check what is :cashed
            - ${VOLUME_MOUNT:-../}:/var/www/html:cached
        environment:
            DATABASE_URL: "mysql://${DB_USER:-user}:${DB_PASSWORD}@db:3306/${DB_NAME:-blog_db}?serverVersion=8.0.32&charset=utf8mb4"
            MAILER_DSN: "smtp://mailhog:1025"
            APP_ENV: ${APP_ENV:-dev}
            APP_SECRET: ${APP_SECRET}
        depends_on:
            db:
                condition: service_healthy
        networks:
            - symfony_network
        healthcheck:
            test: ["CMD-SHELL", "php-fpm -t || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3

    nginx:
        image: nginx:alpine
        container_name: my_blog_nginx
        restart: unless-stopped
        ports:
            - "${NGINX_PORT:-8080}:80"
        volumes:
             #// TODO CHECK WHAT IS RO
            - ${VOLUME_MOUNT:-../}/public:/var/www/html/public:ro
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            app:
                condition: service_healthy
        networks:
            - symfony_network
        healthcheck:
            test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
            interval: 30s
            timeout: 10s
            retries: 3

    db:
        image: mysql:8.0
        container_name: my_blog_db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_NAME:-blog_db}
            MYSQL_USER: ${DB_USER:-user}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
        volumes:
            - db_data:/var/lib/mysql
        ports:
            - "3306:3306"
        networks:
            - symfony_network
        healthcheck: #// TODO можно ли его запускать только в дев режиме
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
            interval: 30s
            timeout: 10s
            retries: 5
        command: --default-authentication-plugin=mysql_native_password

    mailhog:
        image: mailhog/mailhog
        container_name: my_blog_mailhog
        restart: unless-stopped
        ports:
            - "${MAILHOG_SMTP_PORT:-1025}:1025"
            - "${MAILHOG_WEB_PORT:-8025}:8025"
        networks:
            - symfony_network
        profiles:
            - dev

    redis:
        image: redis:7-alpine
        container_name: my_blog_redis
        restart: unless-stopped
        volumes:
            - redis_data:/data
        networks:
            - symfony_network
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 30s
            timeout: 10s
            retries: 3

networks: #// todo - что можно делать с нетворками в докере
    symfony_network:
        driver: bridge

volumes:
    db_data:
        driver: local
    redis_data:
        driver: local
